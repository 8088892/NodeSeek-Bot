name: NodeSeek 签到+评论

on:
  push:
    branches: [main]
  schedule:
    - cron: '05 16 * * *'   # 北京时间 00:05
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  run:
    runs-on: ubuntu-22.04
    timeout-minutes: 25

    steps:
      - name: 检出代码
        uses: actions/checkout@v3

      - name: 安装 Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 安装 Chrome (评论功能需要)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb fonts-wqy-zenhei
          # 使用系统的 Chrome，不额外安装
          google-chrome --version || echo "Chrome not found, installing..."
          if ! command -v google-chrome &>/dev/null; then
            wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
            echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
            sudo apt-get update && sudo apt-get install -y google-chrome-stable
          fi
          echo "Chrome: $(google-chrome --version)"

      - name: 安装 Python 依赖
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: 运行签到+评论
        env:
          # ── 账号配置 ──
          USER: ${{ secrets.USER }}
          PASS: ${{ secrets.PASS }}
          USER1: ${{ secrets.USER1 }}
          PASS1: ${{ secrets.PASS1 }}
          USER2: ${{ secrets.USER2 }}
          PASS2: ${{ secrets.PASS2 }}
          USER3: ${{ secrets.USER3 }}
          PASS3: ${{ secrets.PASS3 }}
          USER4: ${{ secrets.USER4 }}
          PASS4: ${{ secrets.PASS4 }}
          USER5: ${{ secrets.USER5 }}
          PASS5: ${{ secrets.PASS5 }}

          # ── Cookie 配置 ──
          NS_COOKIE: ${{ vars.NS_COOKIE || secrets.NS_COOKIE }}

          # ── 验证码 ──
          SOLVER_TYPE: ${{ secrets.SOLVER_TYPE || 'yescaptcha' }}
          API_BASE_URL: ${{ secrets.API_BASE_URL || 'https://api.yescaptcha.com' }}
          CLIENTT_KEY: ${{ secrets.CLIENTT_KEY || secrets.YESCAPTCHA_CLIENT_KEY }}
          NS_TOTP_SECRET: ${{ secrets.NS_TOTP_SECRET }}
          NS_TOTP_FIELD: ${{ secrets.NS_TOTP_FIELD }}
          NS_TOTP_FIELDS: ${{ secrets.NS_TOTP_FIELDS }}

          # ── GitHub API ──
          GH_PAT: ${{ secrets.GH_PAT }}
          GITHUB_REPOSITORY: ${{ github.repository }}

          # ── 通知 ──
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          TG_USER_ID: ${{ secrets.TG_USER_ID }}
          TG_THREAD_ID: ${{ secrets.TG_THREAD_ID }}
          HITOKOTO: 'false'

          # ── 评论 ──
          NS_COMMENT: ${{ secrets.NS_COMMENT }}
          NS_COMMENT_URL: ${{ secrets.NS_COMMENT_URL }}
          NS_DELAY_MIN: "0"
          NS_DELAY_MAX: "0"
          HEADLESS: "false"
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python nodeseek_bot.py
